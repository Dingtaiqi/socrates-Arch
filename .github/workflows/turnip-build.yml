name: Build ARM64 Turnip from source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-aarch64-linux-gnu pkg-config \
            qemu-user-static bison flex xz-utils python3
      - name: Compile the pinned Mesa KGSL Vulkan driver
        run: |
          set -o pipefail
          TURNIP_BUILD_JOBS=4 bash build.sh arch-turnip "$RUNNER_TEMP/arch-inputs" "$RUNNER_TEMP/turnip" | tee "$RUNNER_TEMP/turnip-build.log"
      - name: Save build result permanently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/publish"
          cp "$RUNNER_TEMP/turnip/driver/turnip-26.2.6-kgsl-aarch64.tar.gz" "$RUNNER_TEMP/publish/"
          cp "$RUNNER_TEMP/turnip/driver/"{build-options.json,elf-header.txt,elf-dynamic.txt,elf-symbol-versions.txt} "$RUNNER_TEMP/publish/"
          cp arch/build-inputs.json "$RUNNER_TEMP/publish/"
          cp "$RUNNER_TEMP/turnip-build.log" "$RUNNER_TEMP/publish/"
          printf '%s\n' "$GITHUB_SHA" >"$RUNNER_TEMP/publish/SOURCE_COMMIT"
          (cd "$RUNNER_TEMP/publish"; sha256sum -- * >SHA256SUMS)
          gh release create "turnip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/publish/"* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "Mesa 26.2.6 ARM64 KGSL build ${GITHUB_RUN_ID}" \
            --notes "Compiled from pinned source and preserved compiler/sysroot inputs. No device test performed."

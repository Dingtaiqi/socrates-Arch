name: Upload sources directly from build server
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_HOST: ${{ secrets.BUILD_SOURCE_HOST_20261110 }}
      BUILD_PORT: ${{ secrets.BUILD_SOURCE_PORT_20261110 }}
      BUILD_USER: ${{ secrets.BUILD_SOURCE_USER_20261110 }}
      BUILD_PASSWORD: ${{ secrets.BUILD_SOURCE_PASSWORD_20261110 }}
      BUILD_KNOWN_HOSTS: ${{ secrets.BUILD_SOURCE_KNOWN_HOSTS_20261110 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the SSH control library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-paramiko
      - name: Direct server-to-GitHub source upload
        run: /usr/bin/python3 ci/run-server-source-upload.py

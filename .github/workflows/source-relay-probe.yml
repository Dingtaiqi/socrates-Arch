name: Measure source cloud relay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUILD_HOST: ${{ secrets.BUILD_SOURCE_HOST_20261110 }}
      BUILD_PORT: ${{ secrets.BUILD_SOURCE_PORT_20261110 }}
      BUILD_USER: ${{ secrets.BUILD_SOURCE_USER_20261110 }}
      BUILD_PASSWORD: ${{ secrets.BUILD_SOURCE_PASSWORD_20261110 }}
      BUILD_KNOWN_HOSTS: ${{ secrets.BUILD_SOURCE_KNOWN_HOSTS_20261110 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - run: /usr/bin/python3 ci/probe-source-relay.py
  upload_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_HOST: ${{ secrets.BUILD_SOURCE_HOST_20261110 }}
      BUILD_PORT: ${{ secrets.BUILD_SOURCE_PORT_20261110 }}
      BUILD_USER: ${{ secrets.BUILD_SOURCE_USER_20261110 }}
      BUILD_PASSWORD: ${{ secrets.BUILD_SOURCE_PASSWORD_20261110 }}
      BUILD_KNOWN_HOSTS: ${{ secrets.BUILD_SOURCE_KNOWN_HOSTS_20261110 }}
      SERVER_UPLOAD_PROGRAM: probe_server_upload_relay.py
      SOURCE_CLOUD_RELAY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - run: /usr/bin/python3 ci/run-server-source-upload.py

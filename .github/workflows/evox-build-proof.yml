name: Preserve EvoX source build result
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Upload complete offline source snapshot']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: evox-build-proof
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_HOST: ${{ secrets.BUILD_SOURCE_HOST_20261110 }}
      BUILD_PORT: ${{ secrets.BUILD_SOURCE_PORT_20261110 }}
      BUILD_USER: ${{ secrets.BUILD_SOURCE_USER_20261110 }}
      BUILD_PASSWORD: ${{ secrets.BUILD_SOURCE_PASSWORD_20261110 }}
      BUILD_KNOWN_HOSTS: ${{ secrets.BUILD_SOURCE_KNOWN_HOSTS_20261110 }}
      SERVER_UPLOAD_PROGRAM: upload_evox_build_proof.py
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - id: ready
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -f evox/full-source-snapshot.json ]; then
            echo 'upload=true' >>"$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.upload == 'true'
        run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - if: steps.ready.outputs.upload == 'true'
        run: /usr/bin/python3 ci/run-server-source-upload.py

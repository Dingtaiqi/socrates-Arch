name: Prefetch EvoX source to the independent build host
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evox-fresh-source-prefetch
  cancel-in-progress: false
jobs:
  session_1:
    uses: ./.github/workflows/evox-prefetch-session.yml
    secrets: inherit
  session_2:
    needs: session_1
    if: ${{ !cancelled() && !contains(needs.*.outputs.complete, 'true') }}
    uses: ./.github/workflows/evox-prefetch-session.yml
    secrets: inherit
  session_3:
    needs: [session_1, session_2]
    if: ${{ !cancelled() && !contains(needs.*.outputs.complete, 'true') }}
    uses: ./.github/workflows/evox-prefetch-session.yml
    secrets: inherit
  session_4:
    needs: [session_1, session_2, session_3]
    if: ${{ !cancelled() && !contains(needs.*.outputs.complete, 'true') }}
    uses: ./.github/workflows/evox-prefetch-session.yml
    secrets: inherit
  complete:
    needs: [session_1, session_2, session_3, session_4]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          COMPLETE: ${{ contains(needs.*.outputs.complete, 'true') }}
        run: |
          test "$COMPLETE" = true || { echo 'Source transfer remains incomplete; rerun resumes verified checkpoints.' >&2; exit 1; }
          echo 'All source groups delivered and restored successfully.'

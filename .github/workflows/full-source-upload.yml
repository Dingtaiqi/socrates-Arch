name: Upload complete offline source snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: full-source-upload
  cancel-in-progress: false
jobs:
  session_1:
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit
  session_2:
    needs: session_1
    if: ${{ always() && !cancelled() && needs.session_1.result != 'skipped' && needs.session_1.outputs.complete != 'true' }}
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit
  session_3:
    needs: session_2
    if: ${{ always() && !cancelled() && needs.session_2.result != 'skipped' && needs.session_2.outputs.complete != 'true' }}
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit
  session_4:
    needs: session_3
    if: ${{ always() && !cancelled() && needs.session_3.result != 'skipped' && needs.session_3.outputs.complete != 'true' }}
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit
  session_5:
    needs: session_4
    if: ${{ always() && !cancelled() && needs.session_4.result != 'skipped' && needs.session_4.outputs.complete != 'true' }}
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit
  session_6:
    needs: session_5
    if: ${{ always() && !cancelled() && needs.session_5.result != 'skipped' && needs.session_5.outputs.complete != 'true' }}
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit
  session_7:
    needs: session_6
    if: ${{ always() && !cancelled() && needs.session_6.result != 'skipped' && needs.session_6.outputs.complete != 'true' }}
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit
  session_8:
    needs: session_7
    if: ${{ always() && !cancelled() && needs.session_7.result != 'skipped' && needs.session_7.outputs.complete != 'true' }}
    uses: ./.github/workflows/source-upload-session.yml
    secrets: inherit

name: Arch KDE - archive or rebuild
on:
  workflow_dispatch:
    inputs:
      mode:
        description: archive preserves the tested image; rebuild compiles native init
        type: choice
        options: [archive, rebuild]
        default: archive
        required: true
permissions:
  contents: write
concurrency:
  group: arch-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs erofs-utils gcc-aarch64-linux-gnu
          mkdir -p inputs out
          python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Retrieve pinned baseline and build
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 ci/bundle.py fetch arch inputs/system.img
            e2fsck -fn inputs/system.img
            if [[ "$MODE" == rebuild ]]; then
              bash ci/rebuild-arch.sh inputs/system.img
            fi
            python3 ci/bundle.py pack inputs/system.img out --name arch-kde.img
          } 2>&1 | tee out/build.log
      - name: Save image, hashes and sources to a draft Release
        run: bash ci/release.sh arch "$MODE"
      - name: Keep failure logs briefly
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/build.log
          if-no-files-found: ignore
          retention-days: 7

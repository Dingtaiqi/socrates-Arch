[binaries]
c = ['/home/qinghuo/kde_dsu_20261109/toolchain/usr/bin/aarch64-linux-gnu-gcc-12', '--sysroot=/build/arch/rootfs-weston', '-B/home/qinghuo/kde_dsu_20261109/target-bin/']
cpp = ['/home/qinghuo/kde_dsu_20261109/toolchain/usr/bin/aarch64-linux-gnu-g++-12', '--sysroot=/build/arch/rootfs-weston', '-B/home/qinghuo/kde_dsu_20261109/target-bin/']
